<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Request System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- นำเข้า Bootstrap Icons สำหรับไอคอนในช่องกรอกข้อมูลและปุ่ม -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ภาพพื้นหลังแบบเต็มจอ (เบลอเล็กน้อยและลดความสว่างลงเพื่อให้กล่องล็อกอินเด่นขึ้น) */
        .bg-image {
            /* สามารถเปลี่ยน URL รูปภาพห้องสมุดให้ตรงกับที่ทีมใช้ใน Figma ได้เลยครับ */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                        url('https://images.unsplash.com/photo-1541963463532-d68292c34b19?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* กล่องล็อกอินหลัก สีขาว มุมมน */
        .login-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            overflow: hidden; /* ให้แถบสีน้ำเงินด้านบนโค้งตามกรอบ */
            margin: 20px;
        }

        /* แถบสีน้ำเงินด้านบนของการ์ด (พยายามเลียนแบบภาพซ้อนใน Prototype) */
        .login-header {
            background: linear-gradient(to bottom, rgba(13, 110, 253, 0.8), rgba(0, 50, 150, 0.9)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80') center/cover;
            height: 140px;
            width: 100%;
        }

        .login-body {
            padding: 30px 40px 40px;
        }

        /* การจัดการฟอนต์ข้อความ */
        .system-title {
            font-weight: 700;
            color: #212529;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .system-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 8px;
        }

        /* การแต่งช่องกรอกข้อมูลให้พื้นหลังเทาและไม่มีขอบ (ตาม Prototype) */
        .input-group {
            background-color: #f4f6f8;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .input-group:focus-within {
            border-color: #0d6efd;
            background-color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .input-group-text {
            background-color: transparent;
            border: none;
            color: #6c757d;
            padding-right: 0;
            padding-left: 15px;
        }

        .form-control {
            background-color: transparent;
            border: none;
            padding: 12px 15px;
            font-size: 0.95rem;
            color: #495057;
        }

        .form-control:focus {
            background-color: transparent;
            box-shadow: none;
        }
        
        .form-control::placeholder {
            color: #adb5bd;
        }

        /* ปุ่มซ่อน/แสดงรหัสผ่าน */
        .toggle-password {
            background-color: transparent;
            border: none;
            color: #6c757d;
            padding-right: 15px;
            cursor: pointer;
        }

        /* ปุ่มล็อกอินสีน้ำเงินเข้มขอบมน */
        .btn-login {
            background-color: #0a58ca; /* สีน้ำเงินเข้มตาม Prototype */
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #084298;
            color: white;
        }
    </style>
</head>
<body>

<div class="bg-image">
    <div class="login-card">
        <!-- แถบด้านบนแบบใน Prototype -->
        <div class="login-header"></div>

        <div class="login-body">
            <h4 class="system-title">Book Request System</h4>
            <p class="system-subtitle">ระบบเสนอแนะหนังสือเข้าห้องสมุด</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">อีเมล (Email)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" required placeholder="example@psu.ac.th">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">รหัสผ่าน (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                        <!-- ไอคอนรูปตาแบบใน Prototype -->
                        <span class="input-group-text toggle-password" id="togglePasswordBtn">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100" id="btnSubmit">
                    เข้าสู่ระบบ <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>
            <div id="alertBox" class="alert alert-danger mt-3 d-none small text-center rounded-3"></div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    // สคริปต์สำหรับปุ่มกดซ่อน/แสดงรหัสผ่าน (เพิ่มลูกเล่นให้เหมือนแอปจริง)
    document.getElementById('togglePasswordBtn').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        }
    });

    // สคริปต์ล็อกอินและเชื่อมต่อ API
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('btnSubmit');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>กำลังตรวจสอบ...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const result = await res.json();
            
            if (res.ok) {
                saveAuthData(result.token, result.user);
                window.location.href = result.user.role === 'ADMIN' ? '/admin-dashboard.html' : '/search.html';
            } else {
                alertBox.textContent = result.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ <i class="bi bi-box-arrow-in-right ms-2"></i>';
            }
        } catch (err) {
            alertBox.textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้';
            alertBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = 'เข้าสู่ระบบ <i class="bi bi-box-arrow-in-right ms-2"></i>';
        }
    });
</script>
</body>
</html>
